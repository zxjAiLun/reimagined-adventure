name: Godot migration CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Domain tests
        shell: pwsh
        run: dotnet test tests\Arpg.Domain.Tests\Arpg.Domain.Tests.csproj --configuration Release

      - name: Download Godot 4.7.1 .NET
        shell: pwsh
        run: |
          $godotVersion = "4.7.1"
          $godotArchive = Join-Path $env:RUNNER_TEMP "Godot_v${godotVersion}-stable_mono_win64.zip"
          $godotDirectory = Join-Path $env:RUNNER_TEMP "godot-${godotVersion}"
          $godotUrl = "https://github.com/godotengine/godot/releases/download/${godotVersion}-stable/Godot_v${godotVersion}-stable_mono_win64.zip"
          Invoke-WebRequest -Uri $godotUrl -OutFile $godotArchive
          Expand-Archive -Path $godotArchive -DestinationPath $godotDirectory -Force
          $godotExecutable = Get-ChildItem -Path $godotDirectory -Filter "Godot_v${godotVersion}-stable_mono_win64.exe" -Recurse | Select-Object -First 1
          if ($null -eq $godotExecutable) { throw "Godot executable was not found after extraction." }
          "GODOT_EXECUTABLE=$($godotExecutable.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Godot C# project
        shell: pwsh
        run: |
          & $env:GODOT_EXECUTABLE --headless --editor --path $env:GITHUB_WORKSPACE --quit --build-solutions
          $godotExitCode = $LASTEXITCODE
          if ($null -ne $godotExitCode -and $godotExitCode -ne 0) { exit $godotExitCode }

      - name: Compile Godot C# assembly
        shell: pwsh
        run: |
          dotnet build ".\reimagined adventure.csproj" --configuration Debug --verbosity minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Main scene load
        shell: pwsh
        run: |
          $output = & $env:GODOT_EXECUTABLE --headless --path $env:GITHUB_WORKSPACE --scene res://scenes3d/RunShell3D.tscn --quit-after 120 2>&1 | Out-String
          $godotExitCode = $LASTEXITCODE
          Write-Output $output
          if ($null -ne $godotExitCode -and $godotExitCode -ne 0) { throw "Godot main scene failed to load ($godotExitCode)" }
          if ($output -match "ERROR:|SCRIPT ERROR|Parse Error|Cannot instantiate") { throw "Godot main scene reported an error." }

      - name: Combat, save, and content smoke
        shell: pwsh
        run: |
          $scenes = @(
            "res://scenes/Milestone4Smoke.tscn",
            "res://scenes/Milestone19FullSaveSmoke.tscn",
            "res://scenes/Milestone20ContentRuntimeSmoke.tscn",
            "res://scenes/StabilizationRunLoopSmoke.tscn",
            "res://scenes/RunLoopTransitionSmoke.tscn",
            "res://scenes/StabilizationRegressionSmoke.tscn",
            "res://scenes3d/Isometric3DSpike.tscn",
            "res://scenes3d/Spitter3DRegressionSmoke.tscn",
            "res://scenes3d/Brimstone3DRegressionSmoke.tscn",
            "res://scenes3d/RunLoop3DRegressionSmoke.tscn",
            "res://scenes3d/GameOver3DRegressionSmoke.tscn",
            "res://scenes3d/GreyboxStress3DRegressionSmoke.tscn",
            "res://scenes3d/SaveRecovery3DRegressionSmoke.tscn",
            "res://scenes3d/InventoryEquipment3DRegressionSmoke.tscn",
            "res://scenes3d/LootEconomy3DRegressionSmoke.tscn",
            "res://scenes3d/SkillLoadout3DRegressionSmoke.tscn",
            "res://scenes3d/CombatHud3DRegressionSmoke.tscn",
            "res://scenes3d/CombatTelegraphs3DRegressionSmoke.tscn",
            "res://scenes3d/CombatHitFeedback3DRegressionSmoke.tscn",
            "res://scenes3d/NavigationFoundation3DRegressionSmoke.tscn",
            "res://scenes3d/SpitterNavigation3DRegressionSmoke.tscn",
            "res://scenes3d/CrowdNavigation3DRegressionSmoke.tscn",
            "res://scenes3d/CrowdNavigationMapLifecycle3DRegressionSmoke.tscn",
            "res://scenes3d/BossNavigation3DRegressionSmoke.tscn",
            "res://scenes3d/NavigationPressureBaseline3DRegressionSmoke.tscn",
            "res://scenes3d/EncounterDirector3DRegressionSmoke.tscn",
            "res://scenes3d/EncounterLifecycle3DRegressionSmoke.tscn",
            "res://scenes3d/EnemyScaling3DRegressionSmoke.tscn",
            "res://scenes3d/RunProgression3DRegressionSmoke.tscn",
            "res://scenes3d/MapModifierSelection3DRegressionSmoke.tscn",
            "res://scenes3d/MapModifierRuntime3DRegressionSmoke.tscn",
            "res://scenes3d/EncounterSelection3DRegressionSmoke.tscn",
            "res://scenes3d/EncounterPlanRuntime3DRegressionSmoke.tscn",
            "res://scenes3d/AtlasRouteChoice3DRegressionSmoke.tscn",
            "res://scenes3d/AtlasRouteSaveRecovery3DRegressionSmoke.tscn",
            "res://scenes3d/BuildIntermission3DRegressionSmoke.tscn",
            "res://scenes3d/BuildcraftSaveRecovery3DRegressionSmoke.tscn",
            "res://scenes3d/MalformedSave3DRegressionSmoke.tscn",
            "res://scenes3d/MapScope3DRegressionSmoke.tscn",
            "res://scenes3d/CharacterProgression3DRegressionSmoke.tscn",
            "res://scenes3d/PassiveTree3DRegressionSmoke.tscn"
          )
          foreach ($scene in $scenes) {
            Write-Host "Running $scene"
            $output = & $env:GODOT_EXECUTABLE --headless --path $env:GITHUB_WORKSPACE --scene $scene 2>&1 | Out-String
            $godotExitCode = $LASTEXITCODE
            Write-Output $output
            if ($null -ne $godotExitCode -and $godotExitCode -ne 0) { throw "Godot smoke failed: $scene ($godotExitCode)" }
            if ($output -match "SPIKE_FAIL|ERROR:|SCRIPT ERROR|Parse Error|Cannot instantiate") { throw "Godot smoke reported a failure: $scene" }
          }
